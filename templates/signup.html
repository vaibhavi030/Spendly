{% extends "base.html" %}

{% block title %}Sign Up - Spendly{% endblock %}

{% block content %}
<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">💰</div>
        <h1>Spendly</h1>
        <p class="auth-tagline">Small Steps, Brighter Tomorrows</p>

        <h2>Create your account ✨</h2>
        <p class="auth-subtitle">Start tracking your spending today.</p>

        <form method="POST" class="auth-form">

            <label>Name</label>
            <input
                type="text"
                name="name"
                placeholder="Your name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="At least 6 characters"
                required
            >

            <label>Confirm Password</label>
            <input
                type="password"
                name="confirm_password"
                placeholder="Repeat your password"
                required
            >

            <button type="submit" class="primary-btn">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>
{% endblock %}
