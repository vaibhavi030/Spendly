{% extends "base.html" %}

{% block title %}Login - Spendly{% endblock %}

{% block content %}
<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">💰</div>
        <h1>Spendly</h1>
        <p class="auth-tagline">Small Steps, Brighter Tomorrows</p>

        <h2>Welcome back 👋</h2>
        <p class="auth-subtitle">Login to manage your money better.</p>

        <form method="POST" class="auth-form">

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="primary-btn">
                Login
            </button>

        </form>

        <div class="demo-box">
            <strong>Demo account</strong>
            <span>vaibhavi@example.com</span>
            <span>password</span>
        </div>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Create one</a>
        </p>

    </div>

</div>
{% endblock %}
